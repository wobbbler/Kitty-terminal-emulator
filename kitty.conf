# ====================================================================
# FONTS AND CORE SETTINGS
# ====================================================================
font_size                    14.0

# BEGIN_KITTY_FONTS
font_family                  family="JetBrains Mono"
bold_font                    auto
italic_font                  auto
bold_italic_font             auto
disable_ligatures            never
# END_KITTY_FONTS

# ====================================================================
# NAVIGATION AND TAB BAR SETTINGS
# ====================================================================
tab_bar_edge                 top
tab_bar_style                powerline
tab_powerline_style          slanted

tab_title_template           "  {title}  "
active_tab_title_template    "  {title}  "

active_tab_font_style        bold
inactive_tab_font_style      normal

# ====================================================================
# CURSOR SETTINGS
# ====================================================================
cursor_shape                 beam
cursor_blink_interval        0
cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# ====================================================================
# PERFORMANCE AND OPTIMIZATION
# ====================================================================
linux_display_server         wayland
sync_to_monitor              yes
input_delay                  2
repaint_delay                5
scrollback_lines             10000

# ====================================================================
# WINDOW AND DECORATIONS
# ====================================================================
remember_window_size         no
hide_window_decorations      yes
placement_strategy           center
confirm_os_window_close      0

# ====================================================================
# URLS AND HYPERLINKS
# ====================================================================
url_style                    curly
underline_hyperlinks         always
show_hyperlink_targets       yes

# ====================================================================
# KEYBINDINGS 
# ====================================================================
# Interactive scrollback search via fzf
map ctrl+f                    launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting fzf --ansi --tac --no-sort

# ====================================================================
# COLOR THEME
# ====================================================================
# BEGIN_KITTY_THEME
# Arthur
include current-theme.conf
# END_KITTY_THEME

# Allow Alt+key passthrough to tmux/nvim
kitty_mod ctrl+shift
allow_hyperlinks no
